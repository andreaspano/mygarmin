[project]
name = "training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andreaspano", email = "andrea@spano.it" }
]
requires-python = ">=3.14"
dependencies = [
    "altair>=6.2.2",
    "fastapi>=0.143.0",
    "fitparse>=1.2.0",
    "garminconnect",
    "pandas>=3.0.5",
    "pyyaml>=6.0",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
training = "training:main"
garmin-export-all = "training.garmin:main"
training-fitness-status = "training.garmin.fitness_status:main"
training-activity-reports = "training.interface.activity_report:main"
training-weekly-data = "training.interface.weekly_data:main"
training-daily-data = "training.interface.daily_data:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipython>=9.17.1",
]
